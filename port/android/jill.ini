# Jill-EX Android default settings.
#
# The app installs this file (plus games/ and profiles/) into its data folder
# on first launch:
#
#   /sdcard/JillEX/jill.ini
#   /sdcard/JillEX/games/
#   /sdcard/JillEX/profiles/
#   /sdcard/JillEX/jillt/     Jill 1/2/3 data
#   /sdcard/JillEX/ONESIM/    Onesimus data
#
# Game data is not bundled.  Push your own extracted copies with:
#   adb push jillt   /sdcard/JillEX/
#   adb push ONESIM  /sdcard/JillEX/
#
# Do not copy a Windows jill.ini here: the absolute D:/Emu/... paths will not
# exist on the device (the port falls back to the local folders, but editing
# this file is cleaner).

[external]
dir = external

[game]
id = jill1

[paths]
games = games
jill1 = jillt
jill2 = jillt
jill3 = jillt
onesimus = ONESIM
profiles = profiles

[video]
filter = 0
fps_counter = 0
high_fps = 60
interpolate = 1
resolution = 0
scale = 3
window_mode = 2

[audio]
midi_device = -1
music = 1
pc_speaker = 0
sfx = 1
sfx_volume = 80
volume = 80

[controls]
deadzone = 25
jump = Z|Space
jump_pad = a
move_down = Down
move_down_pad =
move_left = Left|A
move_left_pad =
move_right = Right|D
move_right_pad =
move_up = Up|W
move_up_pad =
throw = X|Left Alt
throw_pad = x

# On-screen touch controls (Android).  Positions are centres in the 320x200
# game frame; OPTIONS > TOUCH CONTROLS lets you drag them and writes them back
# here.  The values below are the built-in defaults.
[touch]
dpad_x = 44
dpad_y = 150
jump_x = 284
jump_y = 146
throw_x = 238
throw_y = 172
start_x = 306
start_y = 12
back_x = 13
back_y = 12

