# Jill-EX PS4 default settings.
#
# Everything here is relative to /data/JillEX (the PS4 data root).  Copy your
# extracted DOS game folders there as jillt/ and ONESIM/:
#
#   /data/JillEX/jillt/    Jill 1/2/3 data (jill1.sha, jill.dma, *.jn1 ...)
#   /data/JillEX/ONESIM/   Onesimus data (ONESIMUS.SHA, *.ONE ...)
#   /data/JillEX/games/    the *.game manifests from this repository
#   /data/JillEX/profiles/ the *.profile files and *.pal palettes
#   /data/JillEX/external/ optional asset packs
#
# Do not copy a Windows jill.ini here: the absolute D:/Emu/... paths will not
# exist on the console.

[external]
dir = external

[game]
id = jill1

[paths]
games = games
jill1 = jillt
jill2 = jillt
jill3 = jillt
onesimus = ONESIM
profiles = profiles

[video]
# auto prefers the native sceVideoOut path (60 Hz), then Piglet, then SDL.
# Force one with: auto | videoout | gl | sdl
filter = 0
high_fps = 60
interpolate = 1
renderer = auto
resolution = 0
scale = 5
window_mode = 2

[audio]
midi_device = -1
music = 1
pc_speaker = 0
sfx = 1
sfx_volume = 80
volume = 80

[debug]
# PS4 only: draw the FPS/profiler overlay (also: --debug).
# T = engine tick, D = frame build, P = present, A = audio mix / budget.
overlay = 0
