# Jill-EX PS Vita default settings.
#
# Everything here is relative to ux0:data/JillEX (the Vita data root), which
# main() chdir()s into at startup:
#
#   ux0:data/JillEX/jillt/    Jill 1/2/3 data (jill1.sha, jill.dma, *.jn1 ...)
#   ux0:data/JillEX/ONESIM/   Onesimus data (ONESIMUS.SHA, *.ONE ...)
#   ux0:data/JillEX/games/    the *.game manifests from this repository
#   ux0:data/JillEX/profiles/ the *.profile files and *.pal palettes
#   ux0:data/JillEX/external/ optional asset packs
#
# Do not copy a Windows jill.ini here: the absolute D:/Emu/... paths will not
# exist on the console.

[external]
dir = external

[game]
id = jill1

[paths]
games = games
jill1 = jillt
jill2 = jillt
jill3 = jillt
onesimus = ONESIM
profiles = profiles

[video]
# Presentation goes through libvita2d; there is no videoout/Piglet path to
# select, and the SDL2 renderer is not used.
filter = 0
fps_counter = 0
high_fps = 60
interpolate = 1
resolution = 0
# The Vita panel is 960x544.  The screen layer clamps the window to the real
# display mode; scale 2 is the largest integer step that fits 320x200.
scale = 2
window_mode = 2

[audio]
midi_device = -1
music = 1
pc_speaker = 0
sfx = 1
sfx_volume = 80
volume = 80

[controls]
jump = Z|Space
jump_pad = a
move_down = Down
move_down_pad = 
move_left = Left|A
move_left_pad = 
move_right = Right|D
move_right_pad = 
move_up = Up|W
move_up_pad = 
throw = X|Left Alt
throw_pad = x

[debug]