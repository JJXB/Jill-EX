# Jill-EX original Xbox default settings.
#
# Everything here is relative to the data root, which is the folder the XBE is
# launched from (D:\ on a burned XISO, otherwise the first candidate with a
# jill.ini: D:\, E:\JillEX, E:\Apps\Jill-EX, ... - see
# port/src/platform_paths.cpp):
#
#   <root>\jillt\     Jill 1/2/3 data (jill1.sha, jill.dma, *.jn1 ...)
#   <root>\ONESIM\    Onesimus data (ONESIMUS.SHA, *.ONE ...)
#   <root>\games\     the *.game manifests from this repository
#   <root>\profiles\  the *.profile files and *.pal palettes
#   <root>\external\  optional asset packs
#
# Do not copy a Windows jill.ini here: the absolute D:/Emu/... paths will not
# exist on the console (D: is the DVD drive).

[external]
dir = external

[game]
id = jill1

[paths]
games = games
jill1 = jillt
jill2 = jillt
jill3 = jillt
onesimus = ONESIM
profiles = profiles

[video]
# The Xbox always outputs full screen.  640x480 is the default; the RESOLUTION
# menu (or resolution = N here) also offers 480p 720x480 and 720p 1280x720.
# Those need a component/HD AV pack and the console's display settings to allow
# them; an unavailable mode falls back to 640x480.
filter = 0
fps_counter = 0
high_fps = 60
interpolate = 1
resolution = 0
scale = 2
window_mode = 2

[debug]
# 1 = draw the debug overlay (FPS, frame/tick/draw/present/audio times).
# The same numbers are written to jill.log as `perf: ...` every 5 seconds.
overlay = 0

[audio]
# No system MIDI device on the Xbox: music is the OPL2/CMF sequencer.
midi_device = -1
music = 1
# 0 = built-in OPL2 (double-precision, ~10-19 ms per 48 kHz buffer on this CPU),
# 1 = Nuked OPL3 (integer, ~10x cheaper, the Xbox default),
# 2 = fmopl.  Nuked is also the more accurate core.
opl_core = 1
pc_speaker = 0
sfx = 1
sfx_volume = 80
volume = 80

[controls]
deadzone = 25
jump = Z|Space
jump_pad = a
# Movement comes from the D-pad and left stick directly (like the other console
# builds), so only the two action buttons need a pad binding.
move_down = Down
move_down_pad = 
move_left = Left|A
move_left_pad = 
move_right = Right|D
move_right_pad = 
move_up = Up|W
move_up_pad = 
throw = X|Left Alt
throw_pad = x
