; Example external asset pack for the Jill port.
; Edit name/game, replace the sample files, then select it in
; OPTIONS > ASSETS or launch with: jill.exe --pack ExamplePack

[pack]
name = Example Boards
game = jill1

; All other files in this pack use the auto-discovered names described in
; EXTASSETS.md, so no explicit section is required.  Manifest entries are
; useful when you want a non-standard filename, for example:
;
; [sprites]
; kind_1 = art/my_creature_strip.png
;
; [music]
; funky = audio/my_title_theme.ogg
