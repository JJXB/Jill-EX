# Jill port settings.  Edit by hand or from the in-game menus.
# [paths] holds the games/profiles directories plus one asset
# directory per installed game id.

[audio]
music = 1
sfx = 1
sfx_volume = 80
volume = 80

[controls]
jump = Z|Space
jump_pad = a
move_down = Down
move_down_pad = 
move_left = Left|A
move_left_pad = 
move_right = Right|D
move_right_pad = 
move_up = Up|W
move_up_pad = 
throw = X|Left Alt
throw_pad = x

[game]
id = jill1

[gameplay]
air_jump_buffer = 0
center_fish_shot = 0
fast_dialogs = 1
fire_crouched = 0
max_knives = 3
menu_theme = 0
message_box = 1
minimap = 0
player_look = 0
player_suit = 0
retain_items = 0

[hud]
background = suit
classic = 0
health = original
text = 15

[paths]
games = games
jill1 = D:/Emu/DOS/C/jillt
jill2 = D:/Emu/DOS/C/jillt
jill3 = D:/Emu/DOS/C/jillt
onesimus = D:/Emu/DOS/C/ONESIM
profiles = profiles

[video]
filter = 0
high_fps = 90
interpolate = 1
resolution = 0
scale = 3
splash = 0
window_mode = 0
